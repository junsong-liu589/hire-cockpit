server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hire_cockpit?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:hire_cockpit}
    password: ${DB_PASSWORD:change-me-local-only}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  cookie-secure: ${COOKIE_SECURE:false}
  cookie-max-age-days: ${WORKSPACE_COOKIE_MAX_AGE_DAYS:365}
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  backup-dir: ${BACKUP_DIR:./data/backups}
  encryption-key: ${APP_ENCRYPTION_KEY:}
