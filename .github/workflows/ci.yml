name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -f backend/pom.xml verify
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run lint && npm run typecheck && npm test && npm run build
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      MYSQL_PASSWORD: ci-only-password
      MYSQL_ROOT_PASSWORD: ci-only-root-password
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose up --build -d
      - run: for i in $(seq 1 60); do curl -fsS http://localhost:8080/actuator/health && exit 0; sleep 5; done; docker compose logs; exit 1
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - if: always()
        run: docker compose down -v
